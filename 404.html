<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page not found — Patricio Cabrera</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --line: #263341;
      --text: #f2f5f7;
      --muted: #9aa8b5;
      --accent: #64d8a4;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: radial-gradient(circle at 70% 25%, rgb(100 216 164 / 9%), transparent 30rem), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(680px, calc(100% - 40px)); }
    .code { margin: 0 0 18px; color: var(--accent); font-size: 0.8rem; font-weight: 750; letter-spacing: 0.14em; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 6.5rem); line-height: 0.95; letter-spacing: -0.06em; }
    p { max-width: 520px; margin: 28px 0 34px; color: var(--muted); font-size: 1.08rem; line-height: 1.65; }
    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      padding: 0 18px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #07120d;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404</p>
    <h1>That route doesn’t exist.</h1>
    <p>The address may be outdated or incomplete. Return to the portfolio to continue.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
