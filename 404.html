<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f2ec">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <title>Página no encontrada — Patricio Cabrera</title>
  <style>
    body { display: grid; min-height: 100vh; place-items: center; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px 0; }
    main .pale-dot { position: static; display: inline-block; margin: 0 0 28px 4px; }
    p.text { max-width: 520px; margin: 24px 0 32px; color: var(--ink-2); font-size: 1.08rem; }
  </style>
</head>
<body class="beam">
  <main>
    <span class="pale-dot" aria-hidden="true"></span>
    <p class="eyebrow">Error 404</p>
    <h1>Esta ruta no existe.</h1>
    <p class="text">Puede que la dirección esté vieja o incompleta. Mirado desde lejos, cualquier camino se ve parecido.</p>
    <a class="button primary" href="/">Volver al inicio</a>
  </main>
</body>
</html>
